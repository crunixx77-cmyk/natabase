name: Natabase Ultra Benchmark

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  benchmark-job:
    name: Run Benchmark Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go Environment
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Prepare Root Go Module
        run: |
          go mod init natabase || true
          go mod tidy

      - name: Prepare Benchmark Module
        run: |
          cd benchmark
          go mod init benchmark || true
          go get github.com/valyala/fasthttp
          go get github.com/HdrHistogram/hdrhistogram-go
          go mod tidy
          cd ..

      - name: Start Natabase Server
        run: |
          go run main.go &
          sleep 10

      - name: Run Benchmark Suite
        run: |
          cd benchmark
          go run .
